<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多Agent实时交易监控系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0b131e;
    color: #cbd5e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* 左侧控制面板：左右各留约1个字空间 */
  .sidebar {
    background-color: #0f1926;
    border-right: 1px solid #1e2d3d;
    display: flex;
    flex-direction: column;
    padding: 0 14px;
    flex-shrink: 0;
  }
  .clock-box {
    height: 68px;
    display: flex;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
  }
  .menu-list {
    list-style: none;
    margin-top: 10px;
  }
  .menu-item {
    padding: 12px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: 0.2s;
  }
  .menu-item:hover { background-color: #162436; color: #fff; }
  .menu-item.active {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.2), transparent);
    border-left: 3px solid #10b981;
    color: #34d399;
    font-weight: bold;
  }

  /* 右侧主区域 */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部栏：战歌 + 上下对齐的状态标签 */
  .topbar {
    height: 68px;
    background-color: #0f1926;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .music-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: #142233;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #1e324a;
    flex: 1;
    max-width: 600px;
  }
  .play-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #38bdf8;
    background: transparent;
    color: #38bdf8;
    cursor: pointer;
  }
  .wave-bar {
    flex: 1;
    height: 4px;
    background: #1e324a;
    border-radius: 2px;
    position: relative;
  }
  .wave-progress {
    width: 35%;
    height: 100%;
    background: #38bdf8;
    border-radius: 2px;
  }

  /* 状态标签：上下排布且大小完全一致 */
  .status-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-left: 20px;
  }
  .status-badge {
    width: 104px;
    height: 24px;
    border-radius: 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: rgba(16, 185, 129, 0.12);
    border: 1px solid #10b981;
    color: #34d399;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #10b981;
  }

  /* 内容顶部次级导航栏 */
  .sub-nav {
    height: 42px;
    background-color: #0d1724;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
  }
  .sub-tab {
    width: 90px;
    height: 26px;
    border: 1px dashed #263952;
    border-radius: 4px;
  }
  .sub-tab.active {
    border: 1px solid #38bdf8;
    background-color: rgba(56, 189, 248, 0.1);
  }

  /* 空白模块化框架区 */
  .workspace {
    flex: 1;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 16px;
  }
  .panel-box {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
    display: grid;
    gap: 10px;
  }
  .sub-box {
    background-color: #132133;
    border: 1px solid #1e3147;
    border-radius: 6px;
  }
</style>
</head>
<body>

  <!-- 左侧控制面板 -->
  <aside class="sidebar">
    <div class="clock-box" id="clock">00:00:00</div>
    <ul class="menu-list" id="menu">
      <li class="menu-item">📈 行情洞察</li>
      <li class="menu-item active">🎛️ 模式选择</li>
      <li class="menu-item">⏪ 模式回测</li>
      <li class="menu-item">✨ 模式生成</li>
      <li class="menu-item">👤 账户状态</li>
      <li class="menu-item">📋 记录日志</li>
      <li class="menu-item">⚙️ 系统配置</li>
    </ul>
  </aside>

  <!-- 右侧主区 -->
  <div class="main-wrapper">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="music-player">
        <button class="play-btn" id="playBtn">▶</button>
        <span style="font-size: 13px; color: #e2e8f0;">战歌</span>
        <div class="wave-bar"><div class="wave-progress"></div></div>
        <span style="font-size: 12px; color: #64748b;">00:07</span>
      </div>

      <div class="status-group">
        <div class="status-badge"><span class="dot"></span>已连接</div>
        <div class="status-badge"><span class="dot"></span>开启模式1</div>
      </div>
    </header>

    <!-- 内容顶部导航栏 -->
    <nav class="sub-nav">
      <div class="sub-tab active"></div>
      <div class="sub-tab"></div>
      <div class="sub-tab"></div>
      <div class="sub-tab"></div>
    </nav>

    <!-- 空白占位框架 -->
    <main class="workspace">
      <div class="panel-box" style="grid-template-columns: 1fr 2fr;">
        <div class="sub-box"></div>
        <div class="sub-box"></div>
      </div>
      <div class="panel-box">
        <div class="sub-box"></div>
      </div>
      <div class="panel-box" style="grid-template-columns: 1fr 1fr;">
        <div class="sub-box"></div>
        <div class="sub-box"></div>
      </div>
      <div class="panel-box" style="grid-template-columns: 1fr 1fr;">
        <div class="sub-box"></div>
        <div class="sub-box"></div>
      </div>
    </main>
  </div>

<script>
  // 1. 实时秒级时钟
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. 左侧菜单点击切换高亮
  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });

  // 3. 战歌按钮切换状态
  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', () => {
    playBtn.innerText = playBtn.innerText === '▶' ? '❚❚' : '▶';
  });
</script>
</body>
</html>
