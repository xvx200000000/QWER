<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多Agent实时交易监控系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0b131e;
    color: #cbd5e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    background-color: #0f1926;
    border-right: 1px solid #1e2d3d;
    display: flex;
    flex-direction: column;
    padding: 0 12px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .clock-box {
    height: 68px;
    display: flex;
    align-items: center;
    padding-left: 4px;
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .menu-list {
    list-style: none;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .menu-parent {
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
    transition: 0.15s;
    color: #dbeafe;
  }
  .menu-parent:hover {
    background-color: #162436;
    color: #ffffff;
  }
  .menu-parent.open {
    background-color: rgba(56, 189, 248, 0.1);
    color: #7dd3fc;
  }
  .menu-left {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .arrow {
    font-size: 10px;
    color: #64748b;
    transition: transform 0.2s;
  }
  .menu-parent.open .arrow {
    transform: rotate(90deg);
    color: #38bdf8;
  }

  .sub-menu-list {
    list-style: none;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 16px;
    margin: 2px 0 4px;
  }
  .sub-menu-list.show {
    display: flex;
  }
  .sub-menu-item {
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 13px;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.15s;
  }
  .sub-menu-item:hover {
    background-color: #152334;
    color: #f1f5f9;
  }
  .sub-menu-item.active {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), transparent);
    border-left: 2px solid #10b981;
    color: #34d399;
    font-weight: bold;
  }

  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .topbar {
    height: 68px;
    background-color: #0f1926;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    flex-shrink: 0;
  }
  .music-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: #142233;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #1e324a;
    flex: 1;
    max-width: 560px;
    min-width: 0;
  }
  .play-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #38bdf8;
    background: transparent;
    color: #38bdf8;
    cursor: pointer;
    flex-shrink: 0;
  }
  .wave-bar {
    flex: 1;
    height: 4px;
    background: #1e324a;
    border-radius: 2px;
    overflow: hidden;
  }
  .wave-progress {
    width: 35%;
    height: 100%;
    background: #38bdf8;
  }

  .status-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-left: 14px;
    flex-shrink: 0;
  }
  .status-badge {
    min-width: 104px;
    padding: 0 10px;
    height: 24px;
    border-radius: 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: rgba(16, 185, 129, 0.12);
    border: 1px solid #10b981;
    color: #34d399;
    white-space: nowrap;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #10b981;
  }

  .tab-bar {
    height: 42px;
    background-color: #0d1724;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .nav-pill {
    height: 28px;
    padding: 0 10px;
    border-radius: 5px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #132133;
    border: 1px solid #22354c;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
  }
  .nav-pill:hover {
    color: #e2e8f0;
    border-color: #334e6e;
  }
  .nav-pill.active {
    background-color: rgba(56, 189, 248, 0.16);
    border-color: #38bdf8;
    color: #f0f9ff;
    font-weight: bold;
  }
  .nav-pill.pinned {
    border-color: rgba(16, 185, 129, 0.45);
    color: #6ee7b7;
  }
  .nav-pill.pinned.active {
    background-color: rgba(16, 185, 129, 0.18);
    border-color: #10b981;
    color: #a7f3d0;
  }
  .close-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1;
    color: #94a3b8;
  }
  .close-x:hover {
    background-color: rgba(239, 68, 68, 0.25);
    color: #fca5a5;
  }

  .workspace {
    flex: 1;
    padding: 14px 18px;
    overflow-y: auto;
  }

  .wireframe-grid {
    height: 100%;
    min-height: 360px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  .wf-box {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 10px;
    display: grid;
    gap: 10px;
  }
  .wf-sub {
    background-color: #132133;
    border: 1px solid #1e3147;
    border-radius: 6px;
  }

  .agent-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 14px;
    min-height: 100%;
  }
  .agent-list-panel, .agent-config-panel {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
  }
  .agent-list-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .agent-card {
    padding: 9px 10px;
    border-radius: 6px;
    background-color: #132133;
    border: 1px solid #1e3147;
    cursor: pointer;
  }
  .agent-card.active {
    border-color: #10b981;
    background-color: rgba(16, 185, 129, 0.12);
  }
  .agent-config-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section-box {
    background-color: #0c1623;
    border: 1px solid #1e3147;
    border-radius: 7px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .section-title {
    font-size: 12px;
    font-weight: bold;
    color: #7dd3fc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .model-status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: bold;
    color: #cbd5e1;
  }
  .refresh-circle-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid #2b4563;
    background-color: #132236;
    color: #7dd3fc;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.15s;
    padding: 0;
  }
  .refresh-circle-btn:hover:not(:disabled) {
    border-color: #38bdf8;
    color: #ffffff;
    background-color: #192d47;
  }
  .refresh-circle-btn.spinning {
    animation: spinCircle 0.8s linear infinite;
    border-color: #f59e0b;
    color: #fbbf24;
  }
  @keyframes spinCircle {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .status-lamp {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .status-lamp.green {
    background-color: #10b981;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.95);
  }
  .status-lamp.yellow {
    background-color: #f59e0b;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.9);
  }

  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-label {
    font-size: 12px;
    color: #94a3b8;
  }
  .form-input, .form-select, .form-textarea {
    background-color: #0b131e;
    border: 1px solid #24364d;
    border-radius: 6px;
    color: #e2e8f0;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #38bdf8;
  }
  .form-textarea {
    min-height: 66px;
    resize: vertical;
  }
  .prompt-textarea {
    min-height: 110px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .skill-chip {
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    background-color: rgba(56, 189, 248, 0.14);
    border: 1px solid #38bdf8;
    color: #e0f2fe;
    cursor: pointer;
  }

  .chat-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 14px;
    height: 100%;
    min-height: 440px;
  }
  .room-sidebar {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .room-item {
    padding: 9px 10px;
    border-radius: 6px;
    background-color: #132133;
    border: 1px solid #1e3147;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .room-item.active {
    border-color: #38bdf8;
    background-color: rgba(56, 189, 248, 0.14);
  }
  .chat-main {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .chat-header {
    border-bottom: 1px solid #1e2d3d;
    padding-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .room-scope-hint {
    font-size: 12px;
    color: #94a3b8;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .scope-tag {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    background-color: rgba(16, 185, 129, 0.14);
    border: 1px solid rgba(16, 185, 129, 0.45);
    color: #a7f3d0;
  }
  .chat-messages {
    flex: 1;
    min-height: 200px;
    overflow-y: auto;
    background-color: #09111b;
    border: 1px solid #1a2a3e;
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-user {
    align-self: flex-end;
    background-color: rgba(56, 189, 248, 0.18);
    border: 1px solid rgba(56, 189, 248, 0.45);
    color: #f0f9ff;
  }
  .msg-agent {
    align-self: flex-start;
    background-color: #132236;
    border: 1px solid #233852;
    color: #e2e8f0;
  }
  .msg-meta {
    font-size: 11px;
    color: #7dd3fc;
    margin-bottom: 3px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .chat-input-box {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #2b415c;
    background-color: #16263a;
    color: #e2e8f0;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { border-color: #38bdf8; }
  .btn-primary {
    background-color: #10b981;
    border-color: #10b981;
    color: #06281e;
    font-weight: bold;
  }

  .generator-card {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 780px;
  }
  .mode-pill-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .mode-pill-item {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    background-color: #132133;
    border: 1px solid #243952;
    color: #cbd5e1;
  }

  /* 网页正中央 2 秒自动消失提示弹窗 */
  .center-toast-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 9999;
    pointer-events: none;
  }
  .center-toast-box {
    max-width: 420px;
    width: 100%;
    background-color: rgba(15, 25, 38, 0.96);
    border: 1px solid #f59e0b;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    border-radius: 10px;
    padding: 14px 16px;
    color: #f8fafc;
    font-size: 12px;
    line-height: 1.55;
  }
  .center-toast-title {
    font-size: 13px;
    font-weight: bold;
    color: #fbbf24;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .center-toast-line {
    margin-top: 4px;
    color: #e2e8f0;
  }
  .center-toast-label {
    color: #93c5fd;
    font-weight: bold;
  }

  @media (max-width: 768px) {
    .clock-box { font-size: 16px; }
    .menu-parent { font-size: 13px; padding: 9px 6px; }
    .sub-menu-item { font-size: 12px; padding: 6px 8px; }
    .wireframe-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
    .agent-layout, .chat-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="clock-box" id="clock">00:00:00</div>
    <ul class="menu-list" id="sidebarMenu"></ul>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="music-player">
        <button class="play-btn" id="playBtn">▶</button>
        <span style="font-size: 13px; color: #e2e8f0;">战歌</span>
        <div class="wave-bar"><div class="wave-progress"></div></div>
        <span style="font-size: 12px; color: #64748b;">00:07</span>
      </div>

      <div class="status-group">
        <div class="status-badge"><span class="dot"></span>已连接</div>
        <div class="status-badge" id="modeBadge"><span class="dot"></span>集团聊天</div>
      </div>
    </header>

    <nav class="tab-bar" id="topTabBar"></nav>
    <main class="workspace" id="workspace"></main>
  </div>

<script>
  window.addEventListener('error', function (e) {
    console.warn('页面捕获异常:', e.message || e);
  });

  const PINNED_TAB = {
    key: '账户状态::总览状态',
    category: '账户状态',
    subItem: '总览状态',
    label: '账户状态',
    pinned: true
  };

  const GROUP_CHAT_NAME = '集团聊天';
  const GROUP_ROOM_ID = 'room_group_chat';

  const PROVIDER_PRESETS = {
    openai_compat: {
      label: 'OpenAI 兼容接口（通用/中转/DeepSeek等）',
      defaultBaseUrl: 'https://api.openai.com/v1',
      defaultModelId: 'gpt-4o-mini',
      baseUrlHint: '填接口根地址，如 https://api.openai.com/v1 或 https://api.deepseek.com/v1'
    },
    openrouter: {
      label: 'OpenRouter 统一网关',
      defaultBaseUrl: 'https://openrouter.ai/api/v1',
      defaultModelId: 'openai/gpt-4o-mini',
      baseUrlHint: '默认 https://openrouter.ai/api/v1'
    },
    anthropic: {
      label: 'Anthropic Claude 接口',
      defaultBaseUrl: 'https://api.anthropic.com/v1/messages',
      defaultModelId: 'claude-3-7-sonnet-20250219',
      baseUrlHint: '默认 https://api.anthropic.com/v1/messages'
    },
    gemini: {
      label: 'Google Gemini 接口',
      defaultBaseUrl: 'https://generativelanguage.googleapis.com/v1beta',
      defaultModelId: 'gemini-3.8-flash',
      baseUrlHint: '默认 https://generativelanguage.googleapis.com/v1beta'
    }
  };

  function normalizeBaseUrl(rawUrl) {
    return String(rawUrl || '')
      .trim()
      .replace(/\/+$/, '')
      .replace(/\/models$/i, '');
  }

  function makeAgent(id, nickname, role, provider, modelId, description, systemPrompt, skills) {
    const preset = PROVIDER_PRESETS[provider] || PROVIDER_PRESETS.openai_compat;
    return {
      id,
      nickname,
      role,
      modelStatus: 'yellow',
      description,
      systemPrompt,
      skills,
      apiConfig: {
        provider,
        baseUrl: preset.defaultBaseUrl,
        apiKey: '',
        modelId: modelId || preset.defaultModelId,
        temperature: 0.7
      }
    };
  }

  const DEFAULT_AGENTS = [
    makeAgent(
      'savior', '救世主', '管理者（Director）',
      'openai_compat', 'gpt-4o-mini',
      '统筹多Agent协作，审批交易指令并控制整体风险。',
      '你是多Agent交易系统的总指挥（救世主），综合机会与风险评估做最终决策。',
      ['全局风控规则', '仓位分配器']
    ),
    makeAgent(
      'mengdao', '梦道', '交易员（Executor）',
      'openrouter', 'anthropic/claude-3.7-sonnet',
      '负责订单执行、滑点控制与止盈止损管理。',
      '你是执行交易员（梦道），按获批指令精准执行下单与风控单。',
      ['OKX下单执行', '止盈止损管理']
    ),
    makeAgent(
      'jijing', '极境', '机会分析师（Bull）',
      'openai_compat', 'deepseek-chat',
      '捕捉高赔率突破、资金异动与潜在多空机会。',
      '你是机会分析师（极境），发掘高盈亏比结构与资金信号。',
      ['K线与量价突破', '资金费率监控']
    ),
    makeAgent(
      'zhenyingxiong', '真英雄', '风险分析师（Bear）',
      'anthropic', 'claude-3-7-sonnet-20250219',
      '排查流动性猎杀、假突破与突发风险。',
      '你是风险分析师（真英雄），重点识别潜在陷阱与风险敞口。',
      ['清算热力图分析', '波动率预警']
    ),
    makeAgent(
      'zhongjishanguang', '终极闪光', '复盘更新员（Updater）',
      'gemini', 'gemini-3.8-flash',
      '复盘交易结果并优化提示词与策略参数。',
      '你是复盘更新员（终极闪光），总结盈亏归因并提出参数优化。',
      ['交易盈亏归因', 'Prompt迭代建议']
    )
  ];

  const ALL_DEFAULT_IDS = DEFAULT_AGENTS.map(a => a.id);
  const DEFAULT_MODES = [
    {
      id: 'mode_preset_1',
      name: '模式预设1',
      agentIds: [...ALL_DEFAULT_IDS]
    },
    {
      id: 'mode_preset_2',
      name: '模式预设2',
      agentIds: [...ALL_DEFAULT_IDS]
    }
  ];

  const STORAGE_KEYS = {
    AGENTS: 'MULTI_AGENT_V4_AGENTS',
    MODES: 'MULTI_AGENT_V4_MODES',
    ROOMS: 'MULTI_AGENT_V4_ROOMS'
  };

  let agentsData = loadAgents();
  let modesData = loadModes();
  let chatRooms = ensureRoomsSynced(loadRooms());

  let openGroups = new Set(['实时聊天', '模式选择']);
  let openTabs = [PINNED_TAB];
  let activeTabKey = PINNED_TAB.key;
  let currentModeName = GROUP_CHAT_NAME;

  let selectedAgentId = agentsData[0].id;
  let activeModeForConfig = modesData[0].name;
  let checkingAgentId = null;
  let showApiKeyPlain = false;

  let activeRoomId = GROUP_ROOM_ID;
  let sendingChat = false;
  let toastTimer = null;

  function showCenterFailureToast(agent, err) {
    const old = document.getElementById('centerFailureToast');
    if (old) old.remove();
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }

    const diag = diagnoseFailure(agent, err);
    const overlay = document.createElement('div');
    overlay.id = 'centerFailureToast';
    overlay.className = 'center-toast-overlay';
    overlay.innerHTML = `
      <div class="center-toast-box">
        <div class="center-toast-title">⚠️ ${escapeHtml(agent.nickname)} 启动未成功</div>
        <div class="center-toast-line"><span class="center-toast-label">原因：</span>${escapeHtml(diag.why)}</div>
        <div class="center-toast-line"><span class="center-toast-label">错在：</span>${escapeHtml(diag.where)}</div>
        <div class="center-toast-line"><span class="center-toast-label">建议：</span>${escapeHtml(diag.how)}</div>
      </div>
    `;
    document.body.appendChild(overlay);

    toastTimer = setTimeout(() => {
      const el = document.getElementById('centerFailureToast');
      if (el) el.remove();
      toastTimer = null;
    }, 2000);
  }

  function diagnoseFailure(agent, err) {
    const api = agent.apiConfig || {};
    const key = String(api.apiKey || '').trim();
    const model = String(api.modelId || '').trim();
    const base = normalizeBaseUrl(api.baseUrl);
    const msg = String(err && err.message ? err.message : '');

    if (!key) {
      return {
        why: '缺少 API Key，无法通过接口鉴权。',
        where: '当前 Agent 的 API Key 输入框为空。',
        how: '填入有效的 API Key 后再点击刷新。'
      };
    }
    if (!model) {
      return {
        why: '缺少真实 Model ID，接口无法定位目标模型。',
        where: '真实 Model ID 输入框为空。',
        how: '填写可用模型名（如 gemini-3.8-flash）后重试。'
      };
    }
    if (!base) {
      return {
        why: '接口地址 Base URL 为空或无效。',
        where: 'Base URL 配置项。',
        how: '填入合法接口根地址后重试。'
      };
    }
    if (/high demand|503|429|quota|overloaded/i.test(msg)) {
      return {
        why: '模型服务端当前高负载或触发频控/配额限制。',
        where: `服务端拒绝了 ${model} 的本次请求。`,
        how: '稍等片刻后手动点击刷新，或切换可用模型。'
      };
    }
    if (/api key|unauthorized|401|403|permission/i.test(msg)) {
      return {
        why: '密钥无效、无权限访问该模型或账号受限。',
        where: 'API Key 或模型访问权限。',
        how: '核对 Key 是否正确且具备该模型权限。'
      };
    }
    if (/model|not found|404|unexpected model/i.test(msg)) {
      return {
        why: '模型名称不可用或接口路径不匹配。',
        where: `Model ID「${model}」或 Base URL「${base}」。`,
        how: '检查模型名与接口版本地址是否匹配。'
      };
    }
    if (/load failed|failed to fetch|networkerror|timeout|cors/i.test(msg)) {
      return {
        why: '浏览器直连请求被中断、超时或网络/跨域受阻。',
        where: `前端直连「${base}」的网络链路。`,
        how: '检查网络或改由后端中转接口请求。'
      };
    }
    return {
      why: msg || '本次连接请求未成功返回。',
      where: `${model} 接口调用过程。`,
      how: '检查配置参数后手动点刷新重试。'
    };
  }

  function loadAgents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.AGENTS);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed.map(a => ({
            ...a,
            modelStatus: a.modelStatus === 'green' ? 'green' : 'yellow',
            skills: Array.isArray(a.skills) ? a.skills : [],
            apiConfig: {
              provider: a.apiConfig?.provider || 'openai_compat',
              baseUrl: a.apiConfig?.baseUrl || 'https://api.openai.com/v1',
              apiKey: a.apiConfig?.apiKey || '',
              modelId: a.apiConfig?.modelId || 'gpt-4o-mini',
              temperature: typeof a.apiConfig?.temperature === 'number' ? a.apiConfig.temperature : 0.7
            }
          }));
        }
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_AGENTS));
  }

  function saveAgents() {
    try {
      localStorage.setItem(STORAGE_KEYS.AGENTS, JSON.stringify(agentsData));
    } catch (e) {}
  }

  function loadModes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.MODES);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed.map(m => ({
            id: m.id,
            name: m.name,
            agentIds: Array.isArray(m.agentIds) ? m.agentIds : []
          }));
        }
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_MODES));
  }

  function saveModes() {
    try {
      localStorage.setItem(STORAGE_KEYS.MODES, JSON.stringify(modesData));
    } catch (e) {}
  }

  function getNowTime() {
    return new Date().toTimeString().split(' ')[0];
  }

  function makeRoomForMode(mode) {
    return {
      id: `room_${mode.id}`,
      name: mode.name,
      boundModeId: mode.id,
      isGroupChat: false,
      messages: [
        {
          senderType: 'system',
          senderName: '系统',
          text: `模式聊天室「${mode.name}」已就绪，仅允许该模式成员协作交流，你也可随时发言。`,
          time: getNowTime()
        }
      ]
    };
  }

  function ensureRoomsSynced(existingRooms) {
    const rooms = Array.isArray(existingRooms) ? existingRooms.slice() : [];

    let groupRoom = rooms.find(r => r.isGroupChat || r.id === GROUP_ROOM_ID);
    if (!groupRoom) {
      groupRoom = {
        id: GROUP_ROOM_ID,
        name: GROUP_CHAT_NAME,
        boundModeId: null,
        isGroupChat: true,
        messages: [
          {
            senderType: 'system',
            senderName: '系统',
            text: '欢迎来到「集团聊天」，所有 Agent 均可在此全局协作，你也可随时发言。',
            time: getNowTime()
          }
        ]
      };
    } else {
      groupRoom.id = GROUP_ROOM_ID;
      groupRoom.name = GROUP_CHAT_NAME;
      groupRoom.isGroupChat = true;
      groupRoom.boundModeId = null;
    }

    const modeRooms = modesData.map(mode => {
      const found = rooms.find(r => r.boundModeId === mode.id);
      if (found) {
        found.name = mode.name;
        found.isGroupChat = false;
        return found;
      }
      return makeRoomForMode(mode);
    });

    return [groupRoom, ...modeRooms];
  }

  function loadRooms() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.ROOMS);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
  }

  function saveRooms() {
    try {
      localStorage.setItem(STORAGE_KEYS.ROOMS, JSON.stringify(chatRooms));
    } catch (e) {}
  }

  function getMenuConfig() {
    const modeNames = modesData.map(m => m.name);
    const chatRoomNames = chatRooms.map(r => r.name);
    return [
      { name: '行情洞察', icon: '📈', children: ['实时盘口', '资金流向', '链上异动'] },
      { name: '实时聊天', icon: '💬', children: chatRoomNames },
      { name: '模式选择', icon: '🎛️', children: modeNames },
      { name: '模式回测', icon: '⏪', children: ['历史回测', '参数对比', '回测报告'] },
      { name: '模式生成', icon: '✨', children: ['创建新模式'] },
      { name: '账户状态', icon: '👤', children: ['总览状态', '持仓明细', '保证金风控'] },
      { name: '记录日志', icon: '📋', children: ['Agent协作记录', '成交流水', '系统报错'] },
      { name: '系统配置', icon: '⚙️', children: ['API密钥', '模型接入', '通知设置'] }
    ];
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getSelectedAgent() {
    return agentsData.find(a => a.id === selectedAgentId) || agentsData[0];
  }

  function getModeByName(name) {
    return modesData.find(m => m.name === name) || modesData[0];
  }

  function getActiveRoom() {
    return chatRooms.find(r => r.id === activeRoomId) || chatRooms[0];
  }

  function getRoomByModeId(modeId) {
    return chatRooms.find(r => r.boundModeId === modeId) || chatRooms[0];
  }

  function getAllowedAgentsForRoom(room) {
    if (!room || room.isGroupChat) {
      return agentsData;
    }
    const mode = modesData.find(m => m.id === room.boundModeId);
    if (!mode) return [];
    return agentsData.filter(a => mode.agentIds.includes(a.id));
  }

  function setHeaderModeLabel(label) {
    currentModeName = label;
    const badge = document.getElementById('modeBadge');
    if (badge) {
      badge.innerHTML = `<span class="dot"></span>${escapeHtml(label)}`;
    }
  }

  function renderSidebar() {
    const ul = document.getElementById('sidebarMenu');
    const activeTab = openTabs.find(t => t.key === activeTabKey);
    const menuConfig = getMenuConfig();

    ul.innerHTML = menuConfig.map(group => {
      const isOpen = openGroups.has(group.name);
      const childrenHtml = group.children.map(sub => {
        const key = `${group.name}::${sub}`;
        const isActive = activeTab && activeTab.key === key;
        return `
          <li class="sub-menu-item ${isActive ? 'active' : ''}" onclick="onSelectSubItem('${group.name}', '${sub.replace(/'/g, "\\'")}')">
            ${escapeHtml(sub)}
          </li>
        `;
      }).join('');

      return `
        <li>
          <div class="menu-parent ${isOpen ? 'open' : ''}" onclick="onToggleGroup('${group.name}')">
            <span class="menu-left"><span>${group.icon}</span><span>${escapeHtml(group.name)}</span></span>
            <span class="arrow">▶</span>
          </div>
          <ul class="sub-menu-list ${isOpen ? 'show' : ''}">
            ${childrenHtml}
          </ul>
        </li>
      `;
    }).join('');
  }

  function onToggleGroup(groupName) {
    if (openGroups.has(groupName)) openGroups.delete(groupName);
    else openGroups.add(groupName);
    renderSidebar();
  }

  function openOrFocusTab(category, subItem) {
    const key = `${category}::${subItem}`;
    if (!openTabs.some(t => t.key === key)) {
      openTabs.push({
        key,
        category,
        subItem,
        label: `${category} · ${subItem}`,
        pinned: false
      });
    }
    activeTabKey = key;
  }

  function onSelectSubItem(category, subItem) {
    openOrFocusTab(category, subItem);

    if (category === '模式选择') {
      const mode = getModeByName(subItem);
      activeModeForConfig = mode.name;
      setHeaderModeLabel(mode.name);
      const boundRoom = getRoomByModeId(mode.id);
      if (boundRoom) activeRoomId = boundRoom.id;
    } else if (category === '实时聊天') {
      const room = chatRooms.find(r => r.name === subItem);
      if (room) {
        activeRoomId = room.id;
        setHeaderModeLabel(room.name);
      }
    }

    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  function renderTopTabs() {
    const bar = document.getElementById('topTabBar');
    bar.innerHTML = openTabs.map(tab => {
      const isActive = tab.key === activeTabKey;
      const closeBtn = tab.pinned
        ? ''
        : `<span class="close-x" title="关闭该栏目" onclick="onCloseTab(event, '${tab.key}')">×</span>`;
      return `
        <div class="nav-pill ${tab.pinned ? 'pinned' : ''} ${isActive ? 'active' : ''}" onclick="onSwitchTab('${tab.key}')">
          <span>${escapeHtml(tab.label)}</span>
          ${closeBtn}
        </div>
      `;
    }).join('');
  }

  function onSwitchTab(key) {
    activeTabKey = key;
    const tab = openTabs.find(t => t.key === key);
    if (tab && tab.category === '实时聊天') {
      const room = chatRooms.find(r => r.name === tab.subItem);
      if (room) {
        activeRoomId = room.id;
        setHeaderModeLabel(room.name);
      }
    } else if (tab && tab.category === '模式选择') {
      activeModeForConfig = tab.subItem;
      setHeaderModeLabel(tab.subItem);
    }
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  function onCloseTab(event, key) {
    event.stopPropagation();
    if (key === PINNED_TAB.key) return;
    const idx = openTabs.findIndex(t => t.key === key);
    if (idx === -1) return;
    openTabs.splice(idx, 1);
    if (activeTabKey === key) {
      const fallback = openTabs[idx - 1] || openTabs[0] || PINNED_TAB;
      activeTabKey = fallback.key;
    }
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  function renderChatWorkspace() {
    const room = getActiveRoom();
    const allowedAgents = getAllowedAgentsForRoom(room);

    const roomListHtml = chatRooms.map(r => `
      <div class="room-item ${r.id === room.id ? 'active' : ''}" onclick="selectRoom('${r.id}')">
        <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
          <div style="font-size:13px;font-weight:bold;color:#f1f5f9;">${escapeHtml(r.name)}</div>
          <div style="font-size:11px;color:#64748b;">
            ${r.isGroupChat ? '全局集团聊天' : '专属模式聊天'} · ${r.messages.length} 条记录
          </div>
        </div>
      </div>
    `).join('');

    const allowedTagsHtml = allowedAgents.length > 0
      ? allowedAgents.map(a => `
          <span class="scope-tag">
            <span class="status-lamp ${a.modelStatus === 'green' ? 'green' : 'yellow'}" style="width:7px;height:7px;margin-right:4px;"></span>${escapeHtml(a.nickname)}
          </span>
        `).join('')
      : `<span style="color:#f59e0b;">当前模式暂未绑定 Agent，可在“模式选择”中勾选</span>`;

    const messagesHtml = room.messages.length === 0
      ? `<div style="color:#64748b;font-size:12px;text-align:center;padding:24px;">暂无消息，输入内容并点击“发送消息”或“模拟回复”开始交流。</div>`
      : room.messages.map(m => {
          if (m.senderType === 'user') {
            return `
              <div class="msg-bubble msg-user">
                <div class="msg-meta"><span>你</span><span>${escapeHtml(m.time)}</span></div>
                <div>${escapeHtml(m.text)}</div>
              </div>
            `;
          }
          if (m.senderType === 'system') {
            return `<div style="font-size:11px;color:#64748b;text-align:center;">[${escapeHtml(m.time)}] ${escapeHtml(m.text)}</div>`;
          }
          return `
            <div class="msg-bubble msg-agent">
              <div class="msg-meta">
                <strong>${escapeHtml(m.senderName)}</strong>
                <span style="color:#64748b;">${escapeHtml(m.role || '')} · ${escapeHtml(m.modelId || '')}</span>
                <span>${escapeHtml(m.time)}</span>
              </div>
              <div>${escapeHtml(m.text)}</div>
            </div>
          `;
        }).join('');

    return `
      <div class="chat-layout">
        <div class="room-sidebar">
          <div class="section-title"><span>聊天室列表</span></div>
          <div style="font-size:11px;color:#64748b;line-height:1.4;">
            首个为「集团聊天」，其余随模式自动生成。
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${roomListHtml}
          </div>
        </div>

        <div class="chat-main">
          <div class="chat-header">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <strong style="font-size:15px;color:#f8fafc;">${escapeHtml(room.name)}</strong>
              <button class="btn" style="padding:3px 8px;" onclick="clearRoomMessages()">清空记录</button>
            </div>
            <div class="room-scope-hint">
              <span>当前频道参与成员（仅限本频道）：</span>
              ${allowedTagsHtml}
            </div>
          </div>

          <div class="chat-messages" id="chatMessagesBox">${messagesHtml}</div>

          <div class="chat-input-box">
            <input class="form-input" id="chatInput" style="flex:1;min-width:180px;" placeholder="在「${escapeHtml(room.name)}」中发言或向本频道 Agent 发送指令..." onkeydown="if(event.key==='Enter' && !sendingChat) sendChatMessage(false)">
            <button class="btn btn-primary" onclick="sendChatMessage(false)" ${sendingChat ? 'disabled' : ''}>
              ${sendingChat ? '输出中...' : '发送消息'}
            </button>
            <button class="btn" onclick="sendChatMessage(true)" ${sendingChat ? 'disabled' : ''}>
              模拟回复
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function selectRoom(id) {
    activeRoomId = id;
    const room = getActiveRoom();
    if (room) {
      setHeaderModeLabel(room.name);
      openOrFocusTab('实时聊天', room.name);
    }
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
    scrollChatBottom();
  }

  function clearRoomMessages() {
    const room = getActiveRoom();
    room.messages = [];
    saveRooms();
    renderWorkspace();
  }

  function scrollChatBottom() {
    setTimeout(() => {
      const box = document.getElementById('chatMessagesBox');
      if (box) box.scrollTop = box.scrollHeight;
    }, 30);
  }

  async function callSingleAgent(agent, userText, maxTokens = 350) {
    const api = agent.apiConfig;
    const cleanKey = String(api.apiKey || '').trim();
    const cleanModel = String(api.modelId || '').trim();
    const baseUrl = normalizeBaseUrl(api.baseUrl);

    if (!cleanKey) {
      throw new Error(`Agent「${agent.nickname}」尚未配置 API Key`);
    }
    if (!cleanModel) {
      throw new Error(`Agent「${agent.nickname}」尚未配置 Model ID`);
    }
    if (!baseUrl) {
      throw new Error(`Agent「${agent.nickname}」尚未配置 Base URL`);
    }

    const skillText = agent.skills && agent.skills.length
      ? `\n已挂载 Skills：${agent.skills.join('、')}`
      : '';
    const fullSystem = `${agent.systemPrompt || ''}${skillText}`.trim();

    if (api.provider === 'anthropic') {
      const res = await fetch(baseUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': cleanKey,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: cleanModel,
          max_tokens: maxTokens,
          temperature: api.temperature,
          system: fullSystem,
          messages: [{ role: 'user', content: userText }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
      return (data.content || []).map(c => c.text || '').join('\n') || JSON.stringify(data);
    }

    if (api.provider === 'gemini') {
      const url = `${baseUrl}/models/${encodeURIComponent(cleanModel)}:generateContent?key=${encodeURIComponent(cleanKey)}`;
      const body = {
        contents: [{ role: 'user', parts: [{ text: userText }] }],
        generationConfig: { temperature: api.temperature, maxOutputTokens: maxTokens }
      };
      if (fullSystem) body.systemInstruction = { parts: [{ text: fullSystem }] };
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
      return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n') || JSON.stringify(data);
    }

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${cleanKey}`
    };
    if (api.provider === 'openrouter') {
      headers['HTTP-Referer'] = window.location.origin;
    }
    const messages = [];
    if (fullSystem) messages.push({ role: 'system', content: fullSystem });
    messages.push({ role: 'user', content: userText });

    const res = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: cleanModel,
        temperature: api.temperature,
        max_tokens: maxTokens,
        messages
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
    return data.choices?.[0]?.message?.content || JSON.stringify(data);
  }

  async function sendChatMessage(isMock) {
    const inputEl = document.getElementById('chatInput');
    const text = (inputEl && inputEl.value.trim()) || '请结合你的角色与技能，对当前行情给出一条简短评估。';
    const room = getActiveRoom();
    const members = getAllowedAgentsForRoom(room);

    room.messages.push({
      senderType: 'user',
      senderName: '你',
      text,
      time: getNowTime()
    });
    if (inputEl) inputEl.value = '';
    saveRooms();
    renderWorkspace();
    scrollChatBottom();

    if (members.length === 0) {
      room.messages.push({
        senderType: 'system',
        senderName: '系统',
        text: '当前聊天室未绑定任何 Agent，仅记录你的发言。',
        time: getNowTime()
      });
      saveRooms();
      renderWorkspace();
      scrollChatBottom();
      return;
    }

    sendingChat = true;
    renderWorkspace();

    for (let i = 0; i < members.length; i++) {
      const agent = members[i];
      if (isMock) {
        const skillStr = agent.skills.length ? `（挂载技能：${agent.skills.join('、')}）` : '';
        room.messages.push({
          senderType: 'agent',
          senderName: `${agent.nickname} [模拟]`,
          role: agent.role,
          modelId: agent.apiConfig.modelId,
          text: `在「${room.name}」收到消息「${text}」${skillStr}。以【${agent.role}】视角回复：${agent.description || '已就绪。'}`,
          time: getNowTime()
        });
      } else {
        try {
          const reply = await callSingleAgent(agent, `[频道：${room.name}] ${text}`);
          agent.modelStatus = 'green';
          saveAgents();
          room.messages.push({
            senderType: 'agent',
            senderName: agent.nickname,
            role: agent.role,
            modelId: agent.apiConfig.modelId,
            text: reply,
            time: getNowTime()
          });
        } catch (err) {
          agent.modelStatus = 'yellow';
          saveAgents();
          room.messages.push({
            senderType: 'agent',
            senderName: `${agent.nickname} [错误]`,
            role: agent.role,
            modelId: agent.apiConfig.modelId,
            text: `调用失败：${err.message}`,
            time: getNowTime()
          });
        }
      }
      saveRooms();
      renderWorkspace();
      scrollChatBottom();
      if (!isMock && i < members.length - 1) {
        await new Promise(r => setTimeout(r, 250));
      }
    }

    sendingChat = false;
    renderWorkspace();
    scrollChatBottom();
  }

  function renderModeGeneratorWorkspace() {
    const modeChips = modesData.map(m => {
      const names = agentsData.filter(a => m.agentIds.includes(a.id)).map(a => a.nickname).join('、') || '无';
      return `<span class="mode-pill-item"><strong>${escapeHtml(m.name)}</strong>（${escapeHtml(names)}）</span>`;
    }).join('');

    const agentCheckboxes = agentsData.map(a => `
      <label class="member-toggle selected" style="cursor:pointer;">
        <input type="checkbox" class="new-mode-agent-cb" value="${a.id}" checked style="margin-right:4px;">
        ${escapeHtml(a.nickname)}
      </label>
    `).join('');

    return `
      <div class="generator-card">
        <div class="section-title">
          <span style="font-size:15px;">✨ 模式生成（同时生成新模式与对应聊天室）</span>
        </div>

        <div class="form-group">
          <label class="form-label">现有模式与对应聊天室</label>
          <div class="mode-pill-list">${modeChips}</div>
        </div>

        <div class="form-group">
          <label class="form-label">新模式名称（将同步创建同名聊天室）</label>
          <input class="form-input" id="newModeNameInput" placeholder="例如：模式预设3 / 高波突破模式">
        </div>

        <div class="form-group">
          <label class="form-label">选择参与该模式的 Agent（仅允许在该模式聊天室发言）</label>
          <div class="member-selector">${agentCheckboxes}</div>
        </div>

        <div>
          <button class="btn btn-primary" onclick="createNewModeAndRoom()">生成模式并创建聊天室</button>
        </div>
      </div>
    `;
  }

  function createNewModeAndRoom() {
    const nameInput = document.getElementById('newModeNameInput');
    const rawName = (nameInput && nameInput.value.trim()) || `模式预设${modesData.length + 1}`;

    if (rawName === GROUP_CHAT_NAME) {
      alert('不能使用“集团聊天”作为子模式名称');
      return;
    }
    if (modesData.some(m => m.name === rawName)) {
      alert(`模式「${rawName}」已存在`);
      return;
    }

    const checkedIds = Array.from(document.querySelectorAll('.new-mode-agent-cb:checked')).map(el => el.value);
    const newMode = {
      id: `mode_${Date.now()}`,
      name: rawName,
      agentIds: checkedIds
    };

    modesData.push(newMode);
    saveModes();

    const newRoom = makeRoomForMode(newMode);
    chatRooms = ensureRoomsSynced([...chatRooms, newRoom]);
    saveRooms();

    activeModeForConfig = newMode.name;
    activeRoomId = newRoom.id;
    setHeaderModeLabel(newMode.name);

    openOrFocusTab('模式选择', newMode.name);
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  function toggleAgentInActiveMode(agentId) {
    const mode = getModeByName(activeModeForConfig);
    if (!mode) return;
    if (mode.agentIds.includes(agentId)) {
      mode.agentIds = mode.agentIds.filter(id => id !== agentId);
    } else {
      mode.agentIds.push(agentId);
    }
    saveModes();
    renderWorkspace();
  }

  function renderWorkspace() {
    const ws = document.getElementById('workspace');
    const tab = openTabs.find(t => t.key === activeTabKey) || PINNED_TAB;

    if (tab.category === '实时聊天') {
      ws.innerHTML = renderChatWorkspace();
      scrollChatBottom();
      return;
    }

    if (tab.category === '模式生成') {
      ws.innerHTML = renderModeGeneratorWorkspace();
      return;
    }

    if (tab.category === '模式选择') {
      const currentMode = getModeByName(tab.subItem || activeModeForConfig);
      activeModeForConfig = currentMode.name;

      const agent = getSelectedAgent();
      const api = agent.apiConfig;
      const preset = PROVIDER_PRESETS[api.provider] || PROVIDER_PRESETS.openai_compat;

      const cards = agentsData.map(a => {
        const inMode = currentMode.agentIds.includes(a.id);
        return `
          <div class="agent-card ${a.id === agent.id ? 'active' : ''}" onclick="selectAgent('${a.id}')">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <span style="font-size:13px;font-weight:bold;color:#f8fafc;">${escapeHtml(a.nickname)}</span>
              <span class="status-lamp ${a.modelStatus === 'green' ? 'green' : 'yellow'}" title="${a.modelStatus === 'green' ? '模型正常' : '模型异常或未检测'}"></span>
            </div>
            <div style="font-size:11px;color:#38bdf8;margin-top:2px;">${escapeHtml(a.role)}</div>
            <div style="font-size:11px;color:${inMode ? '#34d399' : '#64748b'};margin-top:2px;">
              ${inMode ? '✓ 已参与本模式' : '未参与本模式'} · ${escapeHtml(a.apiConfig.modelId || '未填模型ID')}
            </div>
          </div>
        `;
      }).join('');

      const skillChips = agent.skills.map((s, i) => `
        <span class="skill-chip" title="点击移除" onclick="removeSkill(${i})">⚡ ${escapeHtml(s)} ×</span>
      `).join('');

      const isSpinning = checkingAgentId === agent.id;
      const lampClass = agent.modelStatus === 'green' ? 'green' : 'yellow';
      const agentInCurrentMode = currentMode.agentIds.includes(agent.id);

      ws.innerHTML = `
        <div class="agent-layout">
          <div class="agent-list-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;">
              <span>AI 列表 (${agentsData.length})</span>
              <button class="btn" onclick="addAgent()">+ 添加</button>
            </div>
            ${cards}
          </div>

          <div class="agent-config-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d3d;padding-bottom:8px;gap:8px;flex-wrap:wrap;">
              <strong style="font-size:15px;color:#f8fafc;">${escapeHtml(agent.nickname)} · ${escapeHtml(currentMode.name)} 配置</strong>
              <label style="font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:#a7f3d0;">
                <input type="checkbox" ${agentInCurrentMode ? 'checked' : ''} onchange="toggleAgentInActiveMode('${agent.id}')"> 参与「${escapeHtml(currentMode.name)}」
              </label>
            </div>

            <div class="config-grid">
              <div class="form-group">
                <label class="form-label">昵称</label>
                <input class="form-input" value="${escapeHtml(agent.nickname)}" oninput="updateAgent('nickname', this.value)">
              </div>
              <div class="form-group">
                <label class="form-label">角色定位</label>
                <input class="form-input" value="${escapeHtml(agent.role)}" oninput="updateAgent('role', this.value)">
              </div>
              <div class="form-group">
                <label class="form-label">Temperature（0~2）</label>
                <input class="form-input" type="number" step="0.1" min="0" max="2" value="${api.temperature}" oninput="updateApiConfig('temperature', Number(this.value))">
              </div>
            </div>

            <div class="section-box">
              <div class="section-title">
                <span>🔌 大模型接口接入设置（当前 Agent 独享）</span>
                <span class="model-status-indicator">
                  <button
                    class="refresh-circle-btn ${isSpinning ? 'spinning' : ''}"
                    title="单次刷新模型状态（绿灯正常 / 黄灯异常）"
                    onclick="refreshAgentModelStatus()"
                    ${isSpinning ? 'disabled' : ''}
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17 2l4 4-4 4"></path>
                      <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
                      <path d="M7 22l-4-4 4-4"></path>
                      <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
                    </svg>
                  </button>
                  <span class="status-lamp ${lampClass}"></span>
                </span>
              </div>

              <div class="config-grid">
                <div class="form-group">
                  <label class="form-label">接入方式 / 接口类型</label>
                  <select class="form-select" onchange="onProviderChange(this.value)">
                    ${Object.entries(PROVIDER_PRESETS).map(([k, v]) =>
                      `<option value="${k}" ${api.provider === k ? 'selected' : ''}>${escapeHtml(v.label)}</option>`
                    ).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">真实 Model ID</label>
                  <input class="form-input" value="${escapeHtml(api.modelId)}" placeholder="例如 gemini-3.8-flash" oninput="updateApiConfig('modelId', this.value)">
                </div>
              </div>

              <div class="config-grid">
                <div class="form-group">
                  <label class="form-label">接口地址 Base URL（${escapeHtml(preset.baseUrlHint)}）</label>
                  <input class="form-input" value="${escapeHtml(api.baseUrl)}" oninput="updateApiConfig('baseUrl', this.value)">
                </div>
                <div class="form-group">
                  <label class="form-label">
                    API Key
                    <span style="margin-left:8px;color:#38bdf8;cursor:pointer;" onclick="toggleKeyVisibility()">${showApiKeyPlain ? '隐藏' : '显示'}</span>
                  </label>
                  <input class="form-input" type="${showApiKeyPlain ? 'text' : 'password'}" value="${escapeHtml(api.apiKey)}" placeholder="粘贴你的 API Key" oninput="updateApiConfig('apiKey', this.value)">
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">描述</label>
              <textarea class="form-textarea" oninput="updateAgent('description', this.value)">${escapeHtml(agent.description)}</textarea>
            </div>

            <div class="form-group">
              <label class="form-label">提示词（System Prompt）</label>
              <textarea class="form-textarea prompt-textarea" oninput="updateAgent('systemPrompt', this.value)">${escapeHtml(agent.systemPrompt)}</textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Skill</label>
              <div class="skill-tags">${skillChips}</div>
              <div style="display:flex;gap:8px;">
                <input class="form-input" id="skillInput" style="flex:1;" placeholder="输入 Skill 名称" onkeydown="if(event.key==='Enter') addSkill()">
                <button class="btn btn-primary" onclick="addSkill()">添加 Skill</button>
              </div>
            </div>
          </div>
        </div>
      `;
      return;
    }

    ws.innerHTML = `
      <div class="wireframe-grid">
        <div class="wf-box" style="grid-template-columns: 1fr 2fr;">
          <div class="wf-sub"></div>
          <div class="wf-sub"></div>
        </div>
        <div class="wf-box">
          <div class="wf-sub"></div>
        </div>
        <div class="wf-box" style="grid-template-columns: 1fr 1fr;">
          <div class="wf-sub"></div>
          <div class="wf-sub"></div>
        </div>
        <div class="wf-box" style="grid-template-columns: 1fr 1fr;">
          <div class="wf-sub"></div>
          <div class="wf-sub"></div>
        </div>
      </div>
    `;
  }

  function selectAgent(id) {
    selectedAgentId = id;
    renderWorkspace();
  }

  function updateAgent(field, val) {
    const agent = getSelectedAgent();
    agent[field] = val;
    saveAgents();
    if (field === 'nickname' || field === 'role') {
      renderWorkspace();
    }
  }

  // 单次状态检测：成功亮绿灯；失败亮黄灯并在网页正中央弹出 2 秒诊断提示
  async function refreshAgentModelStatus() {
    const agent = getSelectedAgent();
    if (checkingAgentId) return;

    checkingAgentId = agent.id;
    renderWorkspace();

    try {
      await callSingleAgent(agent, '在线状态检测，请仅回复：OK', 16);
      agent.modelStatus = 'green';
    } catch (err) {
      agent.modelStatus = 'yellow';
      showCenterFailureToast(agent, err);
    } finally {
      checkingAgentId = null;
      saveAgents();
      renderWorkspace();
    }
  }

  function updateApiConfig(field, val) {
    const agent = getSelectedAgent();
    agent.apiConfig[field] = val;
    agent.modelStatus = 'yellow';
    saveAgents();
    if (field === 'modelId') {
      renderWorkspace();
    }
  }

  function onProviderChange(newProvider) {
    const agent = getSelectedAgent();
    const preset = PROVIDER_PRESETS[newProvider] || PROVIDER_PRESETS.openai_compat;
    agent.apiConfig.provider = newProvider;
    agent.apiConfig.baseUrl = preset.defaultBaseUrl;
    agent.apiConfig.modelId = preset.defaultModelId;
    agent.modelStatus = 'yellow';
    saveAgents();
    renderWorkspace();
  }

  function toggleKeyVisibility() {
    showApiKeyPlain = !showApiKeyPlain;
    renderWorkspace();
  }

  function addSkill() {
    const el = document.getElementById('skillInput');
    if (!el) return;
    const val = el.value.trim();
    if (!val) return;
    const agent = getSelectedAgent();
    if (!agent.skills.includes(val)) {
      agent.skills.push(val);
      saveAgents();
      renderWorkspace();
    }
  }

  function removeSkill(idx) {
    const agent = getSelectedAgent();
    agent.skills.splice(idx, 1);
    saveAgents();
    renderWorkspace();
  }

  function addAgent() {
    const newAgent = makeAgent(
      'agent_' + Date.now(),
      `Agent ${agentsData.length + 1}`,
      '自定义角色',
      'openai_compat',
      'gpt-4o-mini',
      '',
      '',
      []
    );
    agentsData.push(newAgent);
    modesData.forEach(m => m.agentIds.push(newAgent.id));
    saveModes();
    selectedAgentId = newAgent.id;
    saveAgents();
    renderWorkspace();
  }

  function updateClock() {
    const clockEl = document.getElementById('clock');
    if (clockEl) clockEl.innerText = getNowTime();
  }
  setInterval(updateClock, 1000);
  updateClock();

  const playBtn = document.getElementById('playBtn');
  if (playBtn) {
    playBtn.addEventListener('click', () => {
      playBtn.innerText = playBtn.innerText === '▶' ? '❚❚' : '▶';
    });
  }

  renderSidebar();
  renderTopTabs();
  renderWorkspace();
</script>
</body>
</html>
