<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多Agent实时交易监控系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0b131e;
    color: #cbd5e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* 左侧控制面板：左右各留约1个字空间 */
  .sidebar {
    background-color: #0f1926;
    border-right: 1px solid #1e2d3d;
    display: flex;
    flex-direction: column;
    padding: 0 12px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .clock-box {
    height: 68px;
    display: flex;
    align-items: center;
    padding-left: 4px;
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .menu-list {
    list-style: none;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .menu-parent {
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
    transition: 0.15s;
    color: #dbeafe;
  }
  .menu-parent:hover {
    background-color: #162436;
    color: #ffffff;
  }
  .menu-parent.open {
    background-color: rgba(56, 189, 248, 0.1);
    color: #7dd3fc;
  }
  .menu-left {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .arrow {
    font-size: 10px;
    color: #64748b;
    transition: transform 0.2s;
  }
  .menu-parent.open .arrow {
    transform: rotate(90deg);
    color: #38bdf8;
  }

  /* 细分选项列表 */
  .sub-menu-list {
    list-style: none;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 16px;
    margin: 2px 0 4px;
  }
  .sub-menu-list.show {
    display: flex;
  }
  .sub-menu-item {
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 13px;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.15s;
  }
  .sub-menu-item:hover {
    background-color: #152334;
    color: #f1f5f9;
  }
  .sub-menu-item.active {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), transparent);
    border-left: 2px solid #10b981;
    color: #34d399;
    font-weight: bold;
  }

  /* 右侧主区域 */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* 顶部栏 */
  .topbar {
    height: 68px;
    background-color: #0f1926;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    flex-shrink: 0;
  }
  .music-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: #142233;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #1e324a;
    flex: 1;
    max-width: 560px;
    min-width: 0;
  }
  .play-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #38bdf8;
    background: transparent;
    color: #38bdf8;
    cursor: pointer;
    flex-shrink: 0;
  }
  .wave-bar {
    flex: 1;
    height: 4px;
    background: #1e324a;
    border-radius: 2px;
    overflow: hidden;
  }
  .wave-progress {
    width: 35%;
    height: 100%;
    background: #38bdf8;
  }

  /* 状态标签：上下排布且大小完全一致 */
  .status-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-left: 14px;
    flex-shrink: 0;
  }
  .status-badge {
    width: 104px;
    height: 24px;
    border-radius: 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: rgba(16, 185, 129, 0.12);
    border: 1px solid #10b981;
    color: #34d399;
    white-space: nowrap;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #10b981;
  }

  /* 右侧内容顶部选项导航栏 */
  .tab-bar {
    height: 42px;
    background-color: #0d1724;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .nav-pill {
    height: 28px;
    padding: 0 10px;
    border-radius: 5px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #132133;
    border: 1px solid #22354c;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
  }
  .nav-pill:hover {
    color: #e2e8f0;
    border-color: #334e6e;
  }
  .nav-pill.active {
    background-color: rgba(56, 189, 248, 0.16);
    border-color: #38bdf8;
    color: #f0f9ff;
    font-weight: bold;
  }
  .nav-pill.pinned {
    border-color: rgba(16, 185, 129, 0.45);
    color: #6ee7b7;
  }
  .nav-pill.pinned.active {
    background-color: rgba(16, 185, 129, 0.18);
    border-color: #10b981;
    color: #a7f3d0;
  }
  .close-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1;
    color: #94a3b8;
  }
  .close-x:hover {
    background-color: rgba(239, 68, 68, 0.25);
    color: #fca5a5;
  }

  /* 主工作区 */
  .workspace {
    flex: 1;
    padding: 14px 18px;
    overflow-y: auto;
  }

  /* 空白模块化框架区 */
  .wireframe-grid {
    height: 100%;
    min-height: 360px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  .wf-box {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 10px;
    display: grid;
    gap: 10px;
  }
  .wf-sub {
    background-color: #132133;
    border: 1px solid #1e3147;
    border-radius: 6px;
  }

  /* 模式选择细分项：Dify 风格独立 Agent 配置 */
  .agent-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 14px;
    min-height: 100%;
  }
  .agent-list-panel, .agent-config-panel {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
  }
  .agent-list-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .agent-card {
    padding: 9px 10px;
    border-radius: 6px;
    background-color: #132133;
    border: 1px solid #1e3147;
    cursor: pointer;
  }
  .agent-card.active {
    border-color: #10b981;
    background-color: rgba(16, 185, 129, 0.12);
  }
  .agent-config-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-label {
    font-size: 12px;
    color: #94a3b8;
  }
  .form-input, .form-select, .form-textarea {
    background-color: #0b131e;
    border: 1px solid #24364d;
    border-radius: 6px;
    color: #e2e8f0;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #38bdf8;
  }
  .form-textarea {
    min-height: 68px;
    resize: vertical;
  }
  .prompt-textarea {
    min-height: 115px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .skill-chip {
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    background-color: rgba(56, 189, 248, 0.14);
    border: 1px solid #38bdf8;
    color: #e0f2fe;
    cursor: pointer;
  }
  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #2b415c;
    background-color: #16263a;
    color: #e2e8f0;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-primary {
    background-color: #10b981;
    border-color: #10b981;
    color: #06281e;
    font-weight: bold;
  }

  @media (max-width: 768px) {
    .clock-box { font-size: 16px; }
    .menu-parent { font-size: 13px; padding: 9px 6px; }
    .sub-menu-item { font-size: 12px; padding: 6px 8px; }
    .wireframe-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
    .agent-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- 左侧控制面板 -->
  <aside class="sidebar">
    <div class="clock-box" id="clock">00:00:00</div>
    <ul class="menu-list" id="sidebarMenu"></ul>
  </aside>

  <!-- 右侧主区 -->
  <div class="main-wrapper">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="music-player">
        <button class="play-btn" id="playBtn">▶</button>
        <span style="font-size: 13px; color: #e2e8f0;">战歌</span>
        <div class="wave-bar"><div class="wave-progress"></div></div>
        <span style="font-size: 12px; color: #64748b;">00:07</span>
      </div>

      <div class="status-group">
        <div class="status-badge"><span class="dot"></span>已连接</div>
        <div class="status-badge" id="modeBadge"><span class="dot"></span>开启模式1</div>
      </div>
    </header>

    <!-- 右侧内容顶部选项导航栏（第一个永久固定为“账户状态”，不可关闭） -->
    <nav class="tab-bar" id="topTabBar"></nav>

    <!-- 主内容区 -->
    <main class="workspace" id="workspace"></main>
  </div>

<script>
  const PINNED_TAB = {
    key: '账户状态::总览状态',
    category: '账户状态',
    subItem: '总览状态',
    label: '账户状态',
    pinned: true
  };

  const MENU_CONFIG = [
    {
      name: '行情洞察',
      icon: '📈',
      children: ['实时盘口', '资金流向', '链上异动']
    },
    {
      name: '模式选择',
      icon: '🎛️',
      children: ['多Agent编排', '模式预设1', '模式预设2']
    },
    {
      name: '模式回测',
      icon: '⏪',
      children: ['历史回测', '参数对比', '回测报告']
    },
    {
      name: '模式生成',
      icon: '✨',
      children: ['规则生成', '提示词工坊', '策略模板']
    },
    {
      name: '账户状态',
      icon: '👤',
      children: ['总览状态', '持仓明细', '保证金风控']
    },
    {
      name: '记录日志',
      icon: '📋',
      children: ['Agent协作记录', '成交流水', '系统报错']
    },
    {
      name: '系统配置',
      icon: '⚙️',
      children: ['API密钥', '模型接入', '通知设置']
    }
  ];

  const DEFAULT_AGENTS = [
    {
      id: 'savior',
      nickname: '救世主',
      role: '管理者（Director）',
      model: 'GPT-6.2',
      enabled: true,
      description: '统筹多Agent协作，审批交易指令并控制整体风险。',
      systemPrompt: '你是多Agent交易系统的总指挥（救世主），综合机会与风险评估做最终决策。',
      skills: ['全局风控规则', '仓位分配器']
    },
    {
      id: 'mengdao',
      nickname: '梦道',
      role: '交易员（Executor）',
      model: 'Claude Sonnet 5',
      enabled: true,
      description: '负责订单执行、滑点控制与止盈止损管理。',
      systemPrompt: '你是执行交易员（梦道），按获批指令精准执行下单与风控单。',
      skills: ['OKX下单执行', '止盈止损管理']
    },
    {
      id: 'jijing',
      nickname: '极境',
      role: '机会分析师（Bull）',
      model: 'DeepSeek-R1',
      enabled: true,
      description: '捕捉高赔率突破、资金异动与潜在多空机会。',
      systemPrompt: '你是机会分析师（极境），发掘高盈亏比结构与资金信号。',
      skills: ['K线与量价突破', '资金费率监控']
    },
    {
      id: 'zhenyingxiong',
      nickname: '真英雄',
      role: '风险分析师（Bear）',
      model: 'Claude Sonnet 5',
      enabled: true,
      description: '排查流动性猎杀、假突破与突发风险。',
      systemPrompt: '你是风险分析师（真英雄），重点识别潜在陷阱与风险敞口。',
      skills: ['清算热力图分析', '波动率预警']
    },
    {
      id: 'zhongjishanguang',
      nickname: '终极闪光',
      role: '复盘更新员（Updater）',
      model: 'GPT-6.2',
      enabled: true,
      description: '复盘交易结果并优化提示词与策略参数。',
      systemPrompt: '你是复盘更新员（终极闪光），总结盈亏归因并提出参数优化。',
      skills: ['交易盈亏归因', 'Prompt迭代建议']
    }
  ];

  const STORAGE_KEY = 'AGENTS_CONFIG_ONLY_V1';

  let openGroups = new Set(['模式选择']);
  let openTabs = [PINNED_TAB];
  let activeTabKey = PINNED_TAB.key;
  let agentsData = loadAgents();
  let selectedAgentId = agentsData[0].id;

  function loadAgents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_AGENTS));
  }

  function saveAgents() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(agentsData));
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 渲染左侧控制面板
  function renderSidebar() {
    const ul = document.getElementById('sidebarMenu');
    const activeTab = openTabs.find(t => t.key === activeTabKey);

    ul.innerHTML = MENU_CONFIG.map(group => {
      const isOpen = openGroups.has(group.name);
      const childrenHtml = group.children.map(sub => {
        const key = `${group.name}::${sub}`;
        const isActive = activeTab && activeTab.key === key;
        return `
          <li class="sub-menu-item ${isActive ? 'active' : ''}" onclick="onSelectSubItem('${group.name}', '${sub}')">
            ${escapeHtml(sub)}
          </li>
        `;
      }).join('');

      return `
        <li>
          <div class="menu-parent ${isOpen ? 'open' : ''}" onclick="onToggleGroup('${group.name}')">
            <span class="menu-left"><span>${group.icon}</span><span>${escapeHtml(group.name)}</span></span>
            <span class="arrow">▶</span>
          </div>
          <ul class="sub-menu-list ${isOpen ? 'show' : ''}">
            ${childrenHtml}
          </ul>
        </li>
      `;
    }).join('');
  }

  // 点击左侧大类：展开或收起细分选项
  function onToggleGroup(groupName) {
    if (openGroups.has(groupName)) {
      openGroups.delete(groupName);
    } else {
      openGroups.add(groupName);
    }
    renderSidebar();
  }

  // 点击左侧细分选项：弹出/切换到右侧对应导航栏
  function onSelectSubItem(category, subItem) {
    const key = `${category}::${subItem}`;
    const modeBadge = document.getElementById('modeBadge');
    if (category === '模式选择' && subItem.startsWith('模式预设')) {
      const label = subItem === '模式预设1' ? '开启模式1' : '开启模式2';
      modeBadge.innerHTML = `<span class="dot"></span>${label}`;
    }

    const exists = openTabs.some(t => t.key === key);
    if (!exists) {
      openTabs.push({
        key,
        category,
        subItem,
        label: `${category} · ${subItem}`,
        pinned: false
      });
    }
    activeTabKey = key;
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  // 渲染右侧顶部导航栏（第一个永久固定为“账户状态”，不可关闭）
  function renderTopTabs() {
    const bar = document.getElementById('topTabBar');
    bar.innerHTML = openTabs.map(tab => {
      const isActive = tab.key === activeTabKey;
      const closeBtn = tab.pinned
        ? ''
        : `<span class="close-x" title="关闭该栏目" onclick="onCloseTab(event, '${tab.key}')">×</span>`;
      return `
        <div class="nav-pill ${tab.pinned ? 'pinned' : ''} ${isActive ? 'active' : ''}" onclick="onSwitchTab('${tab.key}')">
          <span>${escapeHtml(tab.label)}</span>
          ${closeBtn}
        </div>
      `;
    }).join('');
  }

  // 点击顶部某个导航栏：切换到该栏目
  function onSwitchTab(key) {
    activeTabKey = key;
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  // 点击导航栏右侧小 X：关闭该栏目
  function onCloseTab(event, key) {
    event.stopPropagation();
    if (key === PINNED_TAB.key) return;
    const idx = openTabs.findIndex(t => t.key === key);
    if (idx === -1) return;

    openTabs.splice(idx, 1);
    if (activeTabKey === key) {
      const fallback = openTabs[idx - 1] || openTabs[0] || PINNED_TAB;
      activeTabKey = fallback.key;
    }
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  // 渲染右侧内容区（当前除“模式选择”细分项外，其余全部为干净空白模块框）
  function renderWorkspace() {
    const ws = document.getElementById('workspace');
    const tab = openTabs.find(t => t.key === activeTabKey) || PINNED_TAB;

    if (tab.category === '模式选择') {
      const agent = agentsData.find(a => a.id === selectedAgentId) || agentsData[0];
      const cards = agentsData.map(a => `
        <div class="agent-card ${a.id === agent.id ? 'active' : ''}" onclick="selectAgent('${a.id}')">
          <div style="font-size:13px;font-weight:bold;color:#f8fafc;">${escapeHtml(a.nickname)}</div>
          <div style="font-size:11px;color:#38bdf8;margin-top:2px;">${escapeHtml(a.role)}</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px;">${escapeHtml(a.model)}</div>
        </div>
      `).join('');

      const skillChips = agent.skills.map((s, i) => `
        <span class="skill-chip" title="点击移除" onclick="removeSkill(${i})">⚡ ${escapeHtml(s)} ×</span>
      `).join('');

      ws.innerHTML = `
        <div class="agent-layout">
          <div class="agent-list-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;">
              <span>AI 列表 (${agentsData.length})</span>
              <button class="btn" onclick="addAgent()">+ 添加</button>
            </div>
            ${cards}
          </div>

          <div class="agent-config-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d3d;padding-bottom:8px;">
              <strong style="font-size:15px;color:#f8fafc;">${escapeHtml(agent.nickname)} · 参数设置</strong>
              <label style="font-size:12px;cursor:pointer;">
                <input type="checkbox" ${agent.enabled ? 'checked' : ''} onchange="updateAgent('enabled', this.checked)"> 启用
              </label>
            </div>

            <div class="config-grid">
              <div class="form-group">
                <label class="form-label">昵称</label>
                <input class="form-input" value="${escapeHtml(agent.nickname)}" oninput="updateAgent('nickname', this.value)">
              </div>
              <div class="form-group">
                <label class="form-label">角色定位</label>
                <input class="form-input" value="${escapeHtml(agent.role)}" oninput="updateAgent('role', this.value)">
              </div>
              <div class="form-group">
                <label class="form-label">模型</label>
                <select class="form-select" onchange="updateAgent('model', this.value)">
                  ${['GPT-6.2', 'Claude Sonnet 5', 'DeepSeek-R1', 'Gemini 3.1 Pro'].map(m =>
                    `<option value="${m}" ${agent.model === m ? 'selected' : ''}>${m}</option>`
                  ).join('')}
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">描述</label>
              <textarea class="form-textarea" oninput="updateAgent('description', this.value)">${escapeHtml(agent.description)}</textarea>
            </div>

            <div class="form-group">
              <label class="form-label">提示词（System Prompt）</label>
              <textarea class="form-textarea prompt-textarea" oninput="updateAgent('systemPrompt', this.value)">${escapeHtml(agent.systemPrompt)}</textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Skill</label>
              <div class="skill-tags">${skillChips}</div>
              <div style="display:flex;gap:8px;">
                <input class="form-input" id="skillInput" style="flex:1;" placeholder="输入 Skill 名称" onkeydown="if(event.key==='Enter') addSkill()">
                <button class="btn btn-primary" onclick="addSkill()">添加 Skill</button>
              </div>
            </div>
          </div>
        </div>
      `;
      return;
    }

    // 其余栏目的内容区保持干净空白模块化框架，等待后续填入具体内容
    ws.innerHTML = `
      <div class="wireframe-grid">
        <div class="wf-box" style="grid-template-columns: 1fr 2fr;">
          <div class="wf-sub"></div>
          <div class="wf-sub"></div>
        </div>
        <div class="wf-box">
          <div class="wf-sub"></div>
        </div>
        <div class="wf-box" style="grid-template-columns: 1fr 1fr;">
          <div class="wf-sub"></div>
          <div class="wf-sub"></div>
        </div>
        <div class="wf-box" style="grid-template-columns: 1fr 1fr;">
          <div class="wf-sub"></div>
          <div class="wf-sub"></div>
        </div>
      </div>
    `;
  }

  function selectAgent(id) {
    selectedAgentId = id;
    renderWorkspace();
  }

  function updateAgent(field, val) {
    const agent = agentsData.find(a => a.id === selectedAgentId) || agentsData[0];
    agent[field] = val;
    saveAgents();
    if (field === 'nickname' || field === 'role' || field === 'model') {
      renderWorkspace();
    }
  }

  function addSkill() {
    const el = document.getElementById('skillInput');
    if (!el) return;
    const val = el.value.trim();
    if (!val) return;
    const agent = agentsData.find(a => a.id === selectedAgentId) || agentsData[0];
    if (!agent.skills.includes(val)) {
      agent.skills.push(val);
      saveAgents();
      renderWorkspace();
    }
  }

  function removeSkill(idx) {
    const agent = agentsData.find(a => a.id === selectedAgentId) || agentsData[0];
    agent.skills.splice(idx, 1);
    saveAgents();
    renderWorkspace();
  }

  function addAgent() {
    const id = 'agent_' + Date.now();
    agentsData.push({
      id,
      nickname: `Agent ${agentsData.length + 1}`,
      role: '自定义角色',
      model: 'GPT-6.2',
      enabled: true,
      description: '',
      systemPrompt: '',
      skills: []
    });
    selectedAgentId = id;
    saveAgents();
    renderWorkspace();
  }

  // 实时秒级时钟
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 战歌按钮切换
  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', () => {
    playBtn.innerText = playBtn.innerText === '▶' ? '❚❚' : '▶';
  });

  // 初始化
  renderSidebar();
  renderTopTabs();
  renderWorkspace();
</script>
</body>
</html>
