<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多Agent实时交易监控系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0b131e;
    color: #cbd5e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    background-color: #0f1926;
    border-right: 1px solid #1e2d3d;
    display: flex;
    flex-direction: column;
    padding: 0 12px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .clock-box {
    height: 68px;
    display: flex;
    align-items: center;
    padding-left: 4px;
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .menu-list {
    list-style: none;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .menu-parent {
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
    transition: 0.15s;
    color: #dbeafe;
  }
  .menu-parent:hover {
    background-color: #162436;
    color: #ffffff;
  }
  .menu-parent.open {
    background-color: rgba(56, 189, 248, 0.1);
    color: #7dd3fc;
  }
  .menu-left {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .arrow {
    font-size: 10px;
    color: #64748b;
    transition: transform 0.2s;
  }
  .menu-parent.open .arrow {
    transform: rotate(90deg);
    color: #38bdf8;
  }

  .sub-menu-list {
    list-style: none;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 16px;
    margin: 2px 0 4px;
  }
  .sub-menu-list.show {
    display: flex;
  }
  .sub-menu-item {
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 13px;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.15s;
  }
  .sub-menu-item:hover {
    background-color: #152334;
    color: #f1f5f9;
  }
  .sub-menu-item.active {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), transparent);
    border-left: 2px solid #10b981;
    color: #34d399;
    font-weight: bold;
  }

  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .topbar {
    height: 68px;
    background-color: #0f1926;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    flex-shrink: 0;
  }
  .music-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: #142233;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #1e324a;
    flex: 1;
    max-width: 560px;
    min-width: 0;
  }
  .play-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #38bdf8;
    background: transparent;
    color: #38bdf8;
    cursor: pointer;
    flex-shrink: 0;
  }
  .wave-bar {
    flex: 1;
    height: 4px;
    background: #1e324a;
    border-radius: 2px;
    overflow: hidden;
  }
  .wave-progress {
    width: 35%;
    height: 100%;
    background: #38bdf8;
  }

  .status-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-left: 14px;
    flex-shrink: 0;
  }
  .status-badge {
    width: 104px;
    height: 24px;
    border-radius: 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: rgba(16, 185, 129, 0.12);
    border: 1px solid #10b981;
    color: #34d399;
    white-space: nowrap;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #10b981;
  }

  .tab-bar {
    height: 42px;
    background-color: #0d1724;
    border-bottom: 1px solid #1e2d3d;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .nav-pill {
    height: 28px;
    padding: 0 10px;
    border-radius: 5px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #132133;
    border: 1px solid #22354c;
    color: #94a3b8;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
  }
  .nav-pill:hover {
    color: #e2e8f0;
    border-color: #334e6e;
  }
  .nav-pill.active {
    background-color: rgba(56, 189, 248, 0.16);
    border-color: #38bdf8;
    color: #f0f9ff;
    font-weight: bold;
  }
  .nav-pill.pinned {
    border-color: rgba(16, 185, 129, 0.45);
    color: #6ee7b7;
  }
  .nav-pill.pinned.active {
    background-color: rgba(16, 185, 129, 0.18);
    border-color: #10b981;
    color: #a7f3d0;
  }
  .close-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1;
    color: #94a3b8;
  }
  .close-x:hover {
    background-color: rgba(239, 68, 68, 0.25);
    color: #fca5a5;
  }

  .workspace {
    flex: 1;
    padding: 14px 18px;
    overflow-y: auto;
  }

  .wireframe-grid {
    height: 100%;
    min-height: 360px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  .wf-box {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 10px;
    display: grid;
    gap: 10px;
  }
  .wf-sub {
    background-color: #132133;
    border: 1px solid #1e3147;
    border-radius: 6px;
  }

  .agent-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 14px;
    min-height: 100%;
  }
  .agent-list-panel, .agent-config-panel {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
  }
  .agent-list-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .agent-card {
    padding: 9px 10px;
    border-radius: 6px;
    background-color: #132133;
    border: 1px solid #1e3147;
    cursor: pointer;
  }
  .agent-card.active {
    border-color: #10b981;
    background-color: rgba(16, 185, 129, 0.12);
  }
  .agent-config-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section-box {
    background-color: #0c1623;
    border: 1px solid #1e3147;
    border-radius: 7px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .section-title {
    font-size: 12px;
    font-weight: bold;
    color: #7dd3fc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-label {
    font-size: 12px;
    color: #94a3b8;
  }
  .form-input, .form-select, .form-textarea {
    background-color: #0b131e;
    border: 1px solid #24364d;
    border-radius: 6px;
    color: #e2e8f0;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #38bdf8;
  }
  .form-textarea {
    min-height: 66px;
    resize: vertical;
  }
  .prompt-textarea {
    min-height: 110px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .skill-chip {
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    background-color: rgba(56, 189, 248, 0.14);
    border: 1px solid #38bdf8;
    color: #e0f2fe;
    cursor: pointer;
  }
  .test-output {
    background-color: #070d15;
    border: 1px solid #1e2f44;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow-y: auto;
  }

  .chat-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 14px;
    height: 100%;
    min-height: 440px;
  }
  .room-sidebar {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .room-item {
    padding: 9px 10px;
    border-radius: 6px;
    background-color: #132133;
    border: 1px solid #1e3147;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .room-item.active {
    border-color: #38bdf8;
    background-color: rgba(56, 189, 248, 0.14);
  }
  .chat-main {
    background-color: #0f1a29;
    border: 1px solid #1d2e42;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .chat-header {
    border-bottom: 1px solid #1e2d3d;
    padding-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .member-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .member-toggle {
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid #263b54;
    background-color: #132133;
    color: #94a3b8;
    user-select: none;
  }
  .member-toggle.selected {
    border-color: #10b981;
    background-color: rgba(16, 185, 129, 0.16);
    color: #a7f3d0;
  }
  .chat-messages {
    flex: 1;
    min-height: 200px;
    overflow-y: auto;
    background-color: #09111b;
    border: 1px solid #1a2a3e;
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-user {
    align-self: flex-end;
    background-color: rgba(56, 189, 248, 0.18);
    border: 1px solid rgba(56, 189, 248, 0.45);
    color: #f0f9ff;
  }
  .msg-agent {
    align-self: flex-start;
    background-color: #132236;
    border: 1px solid #233852;
    color: #e2e8f0;
  }
  .msg-meta {
    font-size: 11px;
    color: #7dd3fc;
    margin-bottom: 3px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .chat-input-box {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #2b415c;
    background-color: #16263a;
    color: #e2e8f0;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { border-color: #38bdf8; }
  .btn-primary {
    background-color: #10b981;
    border-color: #10b981;
    color: #06281e;
    font-weight: bold;
  }

  @media (max-width: 768px) {
    .clock-box { font-size: 16px; }
    .menu-parent { font-size: 13px; padding: 9px 6px; }
    .sub-menu-item { font-size: 12px; padding: 6px 8px; }
    .wireframe-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
    .agent-layout, .chat-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="clock-box" id="clock">00:00:00</div>
    <ul class="menu-list" id="sidebarMenu"></ul>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="music-player">
        <button class="play-btn" id="playBtn">▶</button>
        <span style="font-size: 13px; color: #e2e8f0;">战歌</span>
        <div class="wave-bar"><div class="wave-progress"></div></div>
        <span style="font-size: 12px; color: #64748b;">00:07</span>
      </div>

      <div class="status-group">
        <div class="status-badge"><span class="dot"></span>已连接</div>
        <div class="status-badge" id="modeBadge"><span class="dot"></span>开启模式1</div>
      </div>
    </header>

    <nav class="tab-bar" id="topTabBar"></nav>
    <main class="workspace" id="workspace"></main>
  </div>

<script>
  const PINNED_TAB = {
    key: '账户状态::总览状态',
    category: '账户状态',
    subItem: '总览状态',
    label: '账户状态',
    pinned: true
  };

  const MENU_CONFIG = [
    { name: '行情洞察', icon: '📈', children: ['实时盘口', '资金流向', '链上异动'] },
    { name: '实时聊天', icon: '💬', children: ['Agent聊天室', '多Agent群聊', '单Agent测试'] },
    { name: '模式选择', icon: '🎛️', children: ['多Agent编排', '模式预设1', '模式预设2'] },
    { name: '模式回测', icon: '⏪', children: ['历史回测', '参数对比', '回测报告'] },
    { name: '模式生成', icon: '✨', children: ['规则生成', '提示词工坊', '策略模板'] },
    { name: '账户状态', icon: '👤', children: ['总览状态', '持仓明细', '保证金风控'] },
    { name: '记录日志', icon: '📋', children: ['Agent协作记录', '成交流水', '系统报错'] },
    { name: '系统配置', icon: '⚙️', children: ['API密钥', '模型接入', '通知设置'] }
  ];

  const PROVIDER_PRESETS = {
    openai_compat: {
      label: 'OpenAI 兼容接口（通用/中转/DeepSeek等）',
      defaultBaseUrl: 'https://api.openai.com/v1',
      defaultModelId: 'gpt-4o-mini',
      baseUrlHint: '填接口根地址，如 https://api.openai.com/v1 或 https://api.deepseek.com/v1'
    },
    openrouter: {
      label: 'OpenRouter 统一网关',
      defaultBaseUrl: 'https://openrouter.ai/api/v1',
      defaultModelId: 'openai/gpt-4o-mini',
      baseUrlHint: '默认 https://openrouter.ai/api/v1'
    },
    anthropic: {
      label: 'Anthropic Claude 接口',
      defaultBaseUrl: 'https://api.anthropic.com/v1/messages',
      defaultModelId: 'claude-3-7-sonnet-20250219',
      baseUrlHint: '默认 https://api.anthropic.com/v1/messages'
    },
    gemini: {
      label: 'Google Gemini 接口',
      defaultBaseUrl: 'https://generativelanguage.googleapis.com/v1beta',
      defaultModelId: 'gemini-2.5-flash',
      baseUrlHint: '默认 https://generativelanguage.googleapis.com/v1beta'
    }
  };

  function normalizeBaseUrl(rawUrl) {
    return String(rawUrl || '')
      .trim()
      .replace(/\/+$/, '')
      .replace(/\/models$/i, '');
  }

  function makeAgent(id, nickname, role, provider, modelId, description, systemPrompt, skills) {
    const preset = PROVIDER_PRESETS[provider] || PROVIDER_PRESETS.openai_compat;
    return {
      id,
      nickname,
      role,
      enabled: true,
      description,
      systemPrompt,
      skills,
      apiConfig: {
        provider,
        baseUrl: preset.defaultBaseUrl,
        apiKey: '',
        modelId: modelId || preset.defaultModelId,
        temperature: 0.7
      },
      testResult: ''
    };
  }

  const DEFAULT_AGENTS = [
    makeAgent(
      'savior', '救世主', '管理者（Director）',
      'openai_compat', 'gpt-4o-mini',
      '统筹多Agent协作，审批交易指令并控制整体风险。',
      '你是多Agent交易系统的总指挥（救世主），综合机会与风险评估做最终决策。',
      ['全局风控规则', '仓位分配器']
    ),
    makeAgent(
      'mengdao', '梦道', '交易员（Executor）',
      'openrouter', 'anthropic/claude-3.7-sonnet',
      '负责订单执行、滑点控制与止盈止损管理。',
      '你是执行交易员（梦道），按获批指令精准执行下单与风控单。',
      ['OKX下单执行', '止盈止损管理']
    ),
    makeAgent(
      'jijing', '极境', '机会分析师（Bull）',
      'openai_compat', 'deepseek-chat',
      '捕捉高赔率突破、资金异动与潜在多空机会。',
      '你是机会分析师（极境），发掘高盈亏比结构与资金信号。',
      ['K线与量价突破', '资金费率监控']
    ),
    makeAgent(
      'zhenyingxiong', '真英雄', '风险分析师（Bear）',
      'anthropic', 'claude-3-7-sonnet-20250219',
      '排查流动性猎杀、假突破与突发风险。',
      '你是风险分析师（真英雄），重点识别潜在陷阱与风险敞口。',
      ['清算热力图分析', '波动率预警']
    ),
    makeAgent(
      'zhongjishanguang', '终极闪光', '复盘更新员（Updater）',
      'gemini', 'gemini-2.5-flash',
      '复盘交易结果并优化提示词与策略参数。',
      '你是复盘更新员（终极闪光），总结盈亏归因并提出参数优化。',
      ['交易盈亏归因', 'Prompt迭代建议']
    )
  ];

  const AGENTS_STORAGE_KEY = 'AGENTS_CONFIG_MULTI_API_V1';
  const ROOMS_STORAGE_KEY = 'AGENT_CHAT_ROOMS_V1';

  let openGroups = new Set(['实时聊天']);
  let openTabs = [PINNED_TAB];
  let activeTabKey = PINNED_TAB.key;
  let agentsData = loadAgents();
  let selectedAgentId = agentsData[0].id;
  let showApiKeyPlain = false;
  let testingAgentId = null;

  let chatRooms = loadRooms();
  let activeRoomId = chatRooms[0].id;
  let sendingChat = false;

  function loadAgents() {
    try {
      const raw = localStorage.getItem(AGENTS_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed.map(a => ({
            ...a,
            skills: Array.isArray(a.skills) ? a.skills : [],
            testResult: a.testResult || '',
            apiConfig: {
              provider: a.apiConfig?.provider || 'openai_compat',
              baseUrl: a.apiConfig?.baseUrl || 'https://api.openai.com/v1',
              apiKey: a.apiConfig?.apiKey || '',
              modelId: a.apiConfig?.modelId || 'gpt-4o-mini',
              temperature: typeof a.apiConfig?.temperature === 'number' ? a.apiConfig.temperature : 0.7
            }
          }));
        }
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_AGENTS));
  }

  function saveAgents() {
    localStorage.setItem(AGENTS_STORAGE_KEY, JSON.stringify(agentsData));
  }

  function createDefaultRooms() {
    const allIds = agentsData.map(a => a.id);
    return [
      {
        id: 'room_war_council',
        name: '多Agent作战室',
        memberIds: allIds,
        messages: [
          {
            senderType: 'system',
            senderName: '系统',
            text: '聊天室已创建。可在上方勾选参与的 Agent，输入消息测试真实接口或点击“模拟回复”测试流程。',
            time: getNowTime()
          }
        ]
      },
      {
        id: 'room_bull_bear',
        name: '多空辩论室',
        memberIds: ['jijing', 'zhenyingxiong', 'savior'].filter(id => agentsData.some(a => a.id === id)),
        messages: []
      }
    ];
  }

  function loadRooms() {
    try {
      const raw = localStorage.getItem(ROOMS_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {}
    return createDefaultRooms();
  }

  function saveRooms() {
    localStorage.setItem(ROOMS_STORAGE_KEY, JSON.stringify(chatRooms));
  }

  function getNowTime() {
    return new Date().toTimeString().split(' ')[0];
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getSelectedAgent() {
    return agentsData.find(a => a.id === selectedAgentId) || agentsData[0];
  }

  function getActiveRoom() {
    return chatRooms.find(r => r.id === activeRoomId) || chatRooms[0];
  }

  function renderSidebar() {
    const ul = document.getElementById('sidebarMenu');
    const activeTab = openTabs.find(t => t.key === activeTabKey);

    ul.innerHTML = MENU_CONFIG.map(group => {
      const isOpen = openGroups.has(group.name);
      const childrenHtml = group.children.map(sub => {
        const key = `${group.name}::${sub}`;
        const isActive = activeTab && activeTab.key === key;
        return `
          <li class="sub-menu-item ${isActive ? 'active' : ''}" onclick="onSelectSubItem('${group.name}', '${sub}')">
            ${escapeHtml(sub)}
          </li>
        `;
      }).join('');

      return `
        <li>
          <div class="menu-parent ${isOpen ? 'open' : ''}" onclick="onToggleGroup('${group.name}')">
            <span class="menu-left"><span>${group.icon}</span><span>${escapeHtml(group.name)}</span></span>
            <span class="arrow">▶</span>
          </div>
          <ul class="sub-menu-list ${isOpen ? 'show' : ''}">
            ${childrenHtml}
          </ul>
        </li>
      `;
    }).join('');
  }

  function onToggleGroup(groupName) {
    if (openGroups.has(groupName)) openGroups.delete(groupName);
    else openGroups.add(groupName);
    renderSidebar();
  }

  function onSelectSubItem(category, subItem) {
    const key = `${category}::${subItem}`;
    const modeBadge = document.getElementById('modeBadge');
    if (category === '模式选择' && subItem.startsWith('模式预设')) {
      modeBadge.innerHTML = `<span class="dot"></span>${subItem === '模式预设1' ? '开启模式1' : '开启模式2'}`;
    }

    if (!openTabs.some(t => t.key === key)) {
      openTabs.push({
        key,
        category,
        subItem,
        label: `${category} · ${subItem}`,
        pinned: false
      });
    }
    activeTabKey = key;
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  function renderTopTabs() {
    const bar = document.getElementById('topTabBar');
    bar.innerHTML = openTabs.map(tab => {
      const isActive = tab.key === activeTabKey;
      const closeBtn = tab.pinned
        ? ''
        : `<span class="close-x" title="关闭该栏目" onclick="onCloseTab(event, '${tab.key}')">×</span>`;
      return `
        <div class="nav-pill ${tab.pinned ? 'pinned' : ''} ${isActive ? 'active' : ''}" onclick="onSwitchTab('${tab.key}')">
          <span>${escapeHtml(tab.label)}</span>
          ${closeBtn}
        </div>
      `;
    }).join('');
  }

  function onSwitchTab(key) {
    activeTabKey = key;
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

  function onCloseTab(event, key) {
    event.stopPropagation();
    if (key === PINNED_TAB.key) return;
    const idx = openTabs.findIndex(t => t.key === key);
    if (idx === -1) return;
    openTabs.splice(idx, 1);
    if (activeTabKey === key) {
      const fallback = openTabs[idx - 1] || openTabs[0] || PINNED_TAB;
      activeTabKey = fallback.key;
    }
    renderSidebar();
    renderTopTabs();
    renderWorkspace();
  }

              </div>
              <button class="btn" style="padding:3px 8px;" onclick="clearRoomMessages()">清空记录</button>

            <div class="member-selector">

          <div class="chat-messages" id="chatMessagesBox">${messagesHtml}</div>

          <div class="chat-input-box">
            <input class="form-input" id="chatInput" style="flex:1;min-width:180px;" placeholder="输入测试指令，例如：分析当前 BTC 波动与风险..." onkeydown="if(event.key==='Enter' && !sendingChat) sendChatMessage(false)">
            <button class="btn btn-primary" onclick="sendChatMessage(false)" ${sendingChat ? 'disabled' : ''}>
              ${sendingChat ? '输出中...' : '发送测试'}

  function createRoom() {
    const input = document.getElementById('newRoomNameInput');
    const name = (input && input.value.trim()) || `聊天室 ${chatRooms.length + 1}`;
    const newRoom = {
      id: 'room_' + Date.now(),
      name,
      memberIds: agentsData.slice(0, 2).map(a => a.id),
      messages: [
        { senderType: 'system', senderName: '系统', text: `已创建聊天室「${name}」`, time: getNowTime() }
      ]
    };
    chatRooms.push(newRoom);
    activeRoomId = newRoom.id;
    saveRooms();
    renderWorkspace();
  }

  function selectRoom(id) {
    activeRoomId = id;
    renderWorkspace();
    scrollChatBottom();
  }

  function deleteRoom(event, id) {
    event.stopPropagation();
    if (chatRooms.length <= 1) return;
    chatRooms = chatRooms.filter(r => r.id !== id);
    if (activeRoomId === id) activeRoomId = chatRooms[0].id;
    saveRooms();
    renderWorkspace();
  }

  function renameRoom() {
    const room = getActiveRoom();
    const nextName = prompt('输入新的聊天室名称：', room.name);
    if (nextName && nextName.trim()) {
      room.name = nextName.trim();
      saveRooms();
      renderWorkspace();
    }
  }

  function clearRoomMessages() {
    const room = getActiveRoom();
    room.messages = [];
    saveRooms();
    renderWorkspace();
  }

  function toggleRoomMember(agentId) {
    const room = getActiveRoom();
    if (room.memberIds.includes(agentId)) {
      room.memberIds = room.memberIds.filter(id => id !== agentId);
    } else {
      room.memberIds.push(agentId);
    }
    saveRooms();
    renderWorkspace();
  }

  function scrollChatBottom() {
    setTimeout(() => {
      const box = document.getElementById('chatMessagesBox');
      if (box) box.scrollTop = box.scrollHeight;
    }, 30);
  }

  async function callSingleAgent(agent, userText) {
    const api = agent.apiConfig;
    const cleanKey = String(api.apiKey || '').trim();
    const cleanModel = String(api.modelId || '').trim();
    const baseUrl = normalizeBaseUrl(api.baseUrl);

    if (!cleanKey) {
      throw new Error(`Agent「${agent.nickname}」尚未配置 API Key（请前往“模式选择”填写）`);
    }
    if (!cleanModel) {
      throw new Error(`Agent「${agent.nickname}」尚未配置 Model ID`);
    }
    if (!baseUrl) {
      throw new Error(`Agent「${agent.nickname}」尚未配置 Base URL`);
    }

    const skillText = agent.skills && agent.skills.length
      ? `\n已挂载 Skills：${agent.skills.join('、')}`
      : '';
    const fullSystem = `${agent.systemPrompt || ''}${skillText}`.trim();

    if (api.provider === 'anthropic') {
      const res = await fetch(baseUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': cleanKey,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: cleanModel,
          max_tokens: 350,
          temperature: api.temperature,
          system: fullSystem,
          messages: [{ role: 'user', content: userText }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
      return (data.content || []).map(c => c.text || '').join('\n') || JSON.stringify(data);
    }

    if (api.provider === 'gemini') {
      const url = `${baseUrl}/models/${encodeURIComponent(cleanModel)}:generateContent?key=${encodeURIComponent(cleanKey)}`;
      const safeUrl = `${baseUrl}/models/${encodeURIComponent(cleanModel)}:generateContent?key=AIza***`;
      const body = {
        contents: [{ role: 'user', parts: [{ text: userText }] }],
        generationConfig: { temperature: api.temperature, maxOutputTokens: 350 }
      };
      if (fullSystem) body.systemInstruction = { parts: [{ text: fullSystem }] };
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(`${data.error?.message || `HTTP ${res.status}`}\n请求路径：${safeUrl}`);
        }
        return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n') || JSON.stringify(data);
      } catch (err) {
        if (/Load failed|Failed to fetch/i.test(err.message)) {
          throw new Error(`${err.message}\n请求路径：${safeUrl}`);
        }
        throw err;
      }
    }

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${cleanKey}`
    };
    if (api.provider === 'openrouter') {
      headers['HTTP-Referer'] = window.location.origin;
    }
    const messages = [];
    if (fullSystem) messages.push({ role: 'system', content: fullSystem });
    messages.push({ role: 'user', content: userText });

    const res = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: cleanModel,
        temperature: api.temperature,
        max_tokens: 350,
        messages
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
    return data.choices?.[0]?.message?.content || JSON.stringify(data);
  }

  async function sendChatMessage(isMock) {
    const inputEl = document.getElementById('chatInput');
    const text = (inputEl && inputEl.value.trim()) || '请结合你的角色与技能，对当前行情给出一条简短评估。';
    const room = getActiveRoom();

    if (room.memberIds.length === 0) {
      alert('请先在上方勾选至少 1 位参与聊天的 Agent');
      return;
    }

    room.messages.push({
      senderType: 'user',
      senderName: '你',
      text,
      time: getNowTime()
    });
    if (inputEl) inputEl.value = '';
    saveRooms();
    renderWorkspace();
    scrollChatBottom();

    sendingChat = true;
    renderWorkspace();

    const members = agentsData.filter(a => room.memberIds.includes(a.id));
    for (const agent of members) {
      if (isMock) {
        const skillStr = agent.skills.length ? `（挂载技能：${agent.skills.join('、')}）` : '';
        room.messages.push({
          senderType: 'agent',
          senderName: `${agent.nickname} [模拟]`,
          role: agent.role,
          modelId: agent.apiConfig.modelId,
          text: `收到指令「${text}」${skillStr}。当前以【${agent.role}】视角测试输出：${agent.description || '已准备就绪，等待真实 API 接入。'}`,
          time: getNowTime()
        });
      } else {
        try {
          const reply = await callSingleAgent(agent, text);
          room.messages.push({
            senderType: 'agent',
            senderName: agent.nickname,
            role: agent.role,
            modelId: agent.apiConfig.modelId,
            text: reply,
            time: getNowTime()
          });
        } catch (err) {
          room.messages.push({
            senderType: 'agent',
            senderName: `${agent.nickname} [错误]`,
            role: agent.role,
            modelId: agent.apiConfig.modelId,
            text: `调用失败：${err.message}`,
            time: getNowTime()
          });
        }
      }
      saveRooms();
      renderWorkspace();
      scrollChatBottom();
    }

    sendingChat = false;
    renderWorkspace();
    scrollChatBottom();
  }

  function selectAgent(id) {

    renderWorkspace();

  function updateAgent(field, val) {
    const agent = getSelectedAgent();
    agent[field] = val;
    saveAgents();
    if (field === 'nickname' || field === 'role') {
      renderWorkspace();
    }
  }

  function updateApiConfig(field, val) {
    const agent = getSelectedAgent();
    agent.apiConfig[field] = val;
    saveAgents();
    if (field === 'modelId') {
      renderWorkspace();
    }
  }

  function onProviderChange(newProvider) {
    const agent = getSelectedAgent();
    const preset = PROVIDER_PRESETS[newProvider] || PROVIDER_PRESETS.openai_compat;
    agent.apiConfig.provider = newProvider;
    agent.apiConfig.baseUrl = preset.defaultBaseUrl;
    agent.apiConfig.modelId = preset.defaultModelId;
    saveAgents();
    renderWorkspace();
  }

  function toggleKeyVisibility() {
    showApiKeyPlain = !showApiKeyPlain;
    renderWorkspace();
  }

  function addSkill() {
    const el = document.getElementById('skillInput');
    if (!el) return;
    const val = el.value.trim();
    if (!val) return;
    const agent = getSelectedAgent();
    if (!agent.skills.includes(val)) {
      agent.skills.push(val);
      saveAgents();
      renderWorkspace();
    }
  }

  function removeSkill(idx) {
    const agent = getSelectedAgent();
    agent.skills.splice(idx, 1);
    saveAgents();
    renderWorkspace();
  }

  function addAgent() {
    const newAgent = makeAgent(
      'agent_' + Date.now(),
      `Agent ${agentsData.length + 1}`,
      '自定义角色',
      'openai_compat',
      'gpt-4o-mini',
      '',
      '',
      []
    );
    agentsData.push(newAgent);
    selectedAgentId = newAgent.id;
    saveAgents();
    renderWorkspace();
  }

  async function testAgentConnection() {
    const agent = getSelectedAgent();
    const userMsgEl = document.getElementById('testPromptInput');
    const userMsg = (userMsgEl && userMsgEl.value.trim()) || '你好，请简短回复收到。';

    testingAgentId = agent.id;
    agent.testResult = '⏳ 正在发送请求...';
    renderWorkspace();

    try {
      const replyText = await callSingleAgent(agent, userMsg);
      agent.testResult = `✅ 调用成功（${agent.apiConfig.modelId}）：\n${replyText}`;
    } catch (err) {
      agent.testResult = `❌ 调用失败：${err.message}\n提示：若接口服务未允许浏览器直接跨域（CORS）或本地网络直连受阻，可改由后端中转请求。`;
    } finally {
      testingAgentId = null;
      saveAgents();
      renderWorkspace();
    }
  }

  function updateClock() {
    document.getElementById('clock').innerText = getNowTime();
  }
  setInterval(updateClock, 1000);
  updateClock();

  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', () => {
    playBtn.innerText = playBtn.innerText === '▶' ? '❚❚' : '▶';
  });

  renderSidebar();
  renderTopTabs();
  renderWorkspace();
</script>
</body>
</html>
